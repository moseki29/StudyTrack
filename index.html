<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071a22">
  <meta name="description" content="A private study planner for learning goals, schedules, sessions, and local study files.">
  <title>StudyTrack — Your study day, in focus</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StudyTrack">
  <style>
    /* Theme and page basics */
    :root {
      color-scheme: dark;
      --page: #071a22;
      --surface: #0d2430;
      --surface-soft: #123647;
      --ink: #edf7f5;
      --muted: #9ab7bd;
      --line: #2a4f5d;
      --accent: #51d7b1;
      --accent-strong: #7be9c8;
      --accent-soft: rgba(81, 215, 177, 0.12);
      --success: #72e0af;
      --danger: #ff7f8d;
      --font-size: 16px;
      --shadow: 0 22px 52px rgb(2 12 18 / 45%);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #071a22;
      --surface: #0d2430;
      --surface-soft: #123647;
      --ink: #edf7f5;
      --muted: #9ab7bd;
      --line: #2a4f5d;
      --accent: #51d7b1;
      --accent-strong: #7be9c8;
      --accent-soft: rgba(81, 215, 177, 0.12);
      --success: #72e0af;
      --danger: #ff7f8d;
      --shadow: 0 22px 52px rgb(2 12 18 / 45%);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 100px; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
      background:
        radial-gradient(circle at top left, rgba(81, 215, 177, 0.12), transparent 28%),
        radial-gradient(circle at right 18%, rgba(17, 96, 127, 0.18), transparent 25%),
        var(--page);
      color: var(--ink);
      font: var(--font-size)/1.5 Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 42%, transparent);
      outline-offset: 2px;
    }
    [hidden] { display: none !important; }
    .shell { width: min(100%, 900px); margin: 0 auto; padding-bottom: 42px; }

    /* Sticky header and shared elements */
    .topbar {
      position: sticky;
      z-index: 5;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 -16px 18px;
      padding: 12px max(16px, env(safe-area-inset-left, 0px)) 12px max(16px, env(safe-area-inset-right, 0px));
      border-bottom: 1px solid rgba(123, 233, 200, 0.15);
      background: rgba(7, 26, 34, 0.72);
      backdrop-filter: blur(18px);
    }
    .brand { display: flex; min-width: 0; align-items: center; gap: 10px; }
    .brand-mark {
      display: grid;
      flex: 0 0 auto;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
      color: #07252d;
      font-size: 22px;
      box-shadow: 0 10px 24px rgba(81, 215, 177, 0.25);
    }
    .brand h1 { overflow: hidden; margin: 0; font-size: 1.04rem; letter-spacing: -.025em; text-overflow: ellipsis; white-space: nowrap; }
    .header-subtitle { overflow: hidden; margin: 1px 0 0; color: var(--muted); font-size: .78rem; text-overflow: ellipsis; white-space: nowrap; }
    .header-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 8px; }
    .header-date { color: var(--muted); font-size: .78rem; text-align: right; }
    .button, .icon-button, .step-button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(19, 46, 57, 0.96), rgba(12, 36, 48, 0.96));
      color: var(--ink);
      box-shadow: 0 8px 18px rgba(2, 11, 17, 0.18);
    }
    .button { padding: 8px 13px; font-weight: 650; }
    .button:hover, .icon-button:hover, .step-button:hover { background: rgba(18, 54, 71, 0.9); }
    .button.primary, .step-button.add { border-color: rgba(123, 233, 200, 0.55); background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%); color: #07252d; }
    :root[data-theme="dark"] .button.primary, :root[data-theme="dark"] .step-button.add { color: #07252d; }
    .button.danger { color: var(--danger); }
    .button.small { min-height: 34px; padding: 5px 10px; font-size: .84rem; }
    .icon-button { min-width: 40px; padding: 0 9px; }
    .notice {
      margin: 0 0 16px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(14, 36, 48, 0.92);
      box-shadow: var(--shadow);
    }
    .notice.error { border-color: rgba(255, 127, 141, 0.45); color: var(--danger); }
    .banner { border-color: rgba(81, 215, 177, 0.45); background: rgba(81, 215, 177, 0.1); }
    .muted { color: var(--muted); }
    .auth-screen { display: grid; min-height: 100vh; align-content: center; justify-items: center; padding: 32px 0; }
    .auth-card { width: min(100%, 440px); padding: 28px; border: 1px solid var(--line); border-radius: 20px; background: rgba(14, 36, 48, 0.95); box-shadow: var(--shadow); }
    .auth-card h1 { margin: 0 0 6px; font-size: 1.5rem; letter-spacing: -.03em; }
    .auth-card > p { color: var(--muted); }
    .auth-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin: 20px 0; padding: 4px; border-radius: 14px; background: rgba(18, 54, 71, 0.8); }
    .auth-tab { min-height: 38px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 650; }
    .auth-tab[aria-pressed="true"] { background: rgba(81, 215, 177, 0.12); color: var(--ink); box-shadow: inset 0 0 0 1px rgba(123, 233, 200, 0.3); }
    .auth-card .field { margin-bottom: 15px; }
    .auth-card .form-actions { margin-top: 18px; }
    .auth-message { min-height: 1.5em; margin: 14px 0 0; color: var(--muted); font-size: .88rem; }
    .auth-message.error { color: var(--danger); }
    .auth-setup { margin-top: 18px; padding: 13px; border: 1px solid var(--line); border-radius: 12px; background: rgba(18, 54, 71, 0.8); font-size: .84rem; }
    .auth-setup p:last-child { margin-bottom: 0; }
    .eyebrow { margin: 0 0 3px; color: var(--accent-strong); font-size: .8rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    h2, h3, p { margin-top: 0; }
    h2 { margin-bottom: 4px; font-size: 1.12rem; letter-spacing: -.02em; }
    h3 { margin-bottom: 8px; font-size: .96rem; }

    /* Page sections */
    .section { margin-bottom: 16px; padding: 19px; border: 1px solid var(--line); border-radius: 20px; background: rgba(14, 36, 48, 0.95); box-shadow: var(--shadow); }
    .section-heading { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .section-heading p { margin: 0; color: var(--muted); font-size: .84rem; }
    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
      padding: 21px;
      border: 1px solid rgba(81, 215, 177, 0.28);
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(12, 36, 48, 0.94), rgba(18, 54, 71, 0.96));
      box-shadow: var(--shadow);
    }
    .hero h2 { margin-bottom: 5px; font-size: clamp(1.25rem, 5vw, 1.7rem); }
    .hero p:last-child { margin: 0; color: var(--muted); }
    .score {
      display: grid;
      width: 72px;
      height: 72px;
      align-content: center;
      justify-items: center;
      border: 1px solid rgba(123, 233, 200, 0.5);
      border-radius: 50%;
      background: rgba(81, 215, 177, 0.08);
      color: var(--accent-strong);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }
    .score strong { font-size: 1.18rem; line-height: 1.1; }
    .score span { margin-top: 3px; color: var(--muted); font-size: .62rem; }
    .target-list, .schedule-days, .reminder-list, .manage-list { display: grid; gap: 10px; }
    .target, .schedule-item, .reminder-item {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(12, 36, 48, 0.88);
    }
    .target.complete { border-color: rgba(114, 224, 175, 0.4); }
    .target-heading, .schedule-row, .reminder-row, .manage-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .target-name, .schedule-title { overflow-wrap: anywhere; font-weight: 700; }
    .target-count, .schedule-time { flex: 0 0 auto; color: var(--muted); font-size: .85rem; }
    .complete-text { color: var(--success); font-weight: 700; }
    .target-meta, .schedule-meta, .reminder-meta { margin: 4px 0 10px; color: var(--muted); font-size: .79rem; }
    .progress-track { height: 7px; overflow: hidden; border-radius: 99px; background: rgba(123, 233, 200, 0.08); }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent) 0%, var(--accent-strong) 100%); transition: width .2s ease; }
    .complete .progress-fill { background: linear-gradient(90deg, var(--success) 0%, #96f7c9 100%); }
    .target-controls { display: flex; align-items: center; gap: 8px; margin-top: 11px; }
    .target-controls .spacer { flex: 1; }
    .step-button { display: grid; width: 34px; min-height: 34px; place-items: center; font-size: 1.1rem; }
    .day-group { padding-top: 12px; border-top: 1px solid var(--line); }
    .day-group:first-child { padding-top: 0; border-top: 0; }
    .day-title { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: .87rem; font-weight: 750; }
    .day-title span:last-child { color: var(--muted); font-weight: 500; }
    .schedule-actions, .form-actions, .backup-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .schedule-actions { flex: 0 0 auto; }
    .reminder-status { flex: 0 0 auto; color: var(--muted); font-size: .76rem; }
    .reminder-status.due { color: var(--accent-strong); font-weight: 700; }
    .empty { padding: 19px; border: 1px dashed var(--line); border-radius: 14px; color: var(--muted); text-align: center; }
    .empty strong { display: block; margin-bottom: 3px; color: var(--ink); }
    .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; }
    .week-day { padding: 9px 2px; border-radius: 12px; background: rgba(18, 54, 71, 0.7); text-align: center; }
    .week-day.today { outline: 1px solid rgba(123, 233, 200, 0.5); background: rgba(81, 215, 177, 0.08); }
    .week-day span { display: block; color: var(--muted); font-size: .68rem; }
    .week-day strong { display: block; margin: 4px 0 2px; font-size: .82rem; }

    /* Forms and settings */
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .field { display: grid; min-width: 0; gap: 5px; margin-bottom: 12px; }
    .field label { font-size: .83rem; font-weight: 650; }
    .field input, .field select {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(18, 54, 71, 0.8);
      color: var(--ink);
    }
    .field input[type="color"] { padding: 4px; }
    .field input[type="checkbox"] { width: 18px; min-height: 18px; accent-color: var(--accent); }
    .field input::placeholder { color: var(--muted); opacity: .8; }
    .inline-field { display: flex; align-items: center; gap: 9px; }
    .weekday-picker { display: flex; flex-wrap: wrap; gap: 7px; }
    .weekday-picker label {
      display: inline-flex;
      min-height: 36px;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(18, 54, 71, 0.8);
      font-size: .8rem;
    }
    .settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; }
    .target-form-wrap, .schedule-form-wrap { margin-bottom: 16px; padding: 14px; border-radius: 16px; background: rgba(18, 54, 71, 0.7); }
    .import-box { margin-bottom: 16px; padding: 14px; border: 1px dashed var(--line); border-radius: 14px; background: rgba(18, 54, 71, 0.7); }
    .import-box textarea { width: 100%; min-height: 170px; resize: vertical; padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: rgba(7, 26, 34, 0.8); color: var(--ink); font: inherit; }
    .import-help { margin: 8px 0 12px; color: var(--muted); font-size: .79rem; }
    .import-preview { display: grid; gap: 8px; margin: 12px 0; }
    .import-preview-item { padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: rgba(7, 26, 34, 0.65); }
    .import-preview-item strong { display: block; overflow-wrap: anywhere; }
    .import-preview-item span { color: var(--muted); font-size: .8rem; }
    .form-actions { justify-content: flex-end; }
    .bedtime-backdrop {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      overflow: auto;
      place-items: center;
      padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
      background: rgba(3, 9, 13, 0.7);
    }
    .bedtime-card {
      width: min(100%, 620px);
      max-height: 100%;
      overflow: auto;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(14, 36, 48, 0.96);
      box-shadow: 0 24px 80px rgb(0 0 0 / 25%);
    }
    .bedtime-card h2 { font-size: 1.5rem; }
    .bedtime-target { display: grid; grid-template-columns: minmax(0, 1fr) 92px; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
    .bedtime-target:first-child { border-top: 0; }
    .bedtime-target input { width: 100%; min-height: 40px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 10px; background: rgba(18, 54, 71, 0.8); color: var(--ink); }
    .bedtime-add { margin: 12px 0; padding: 12px; border-radius: 12px; background: rgba(18, 54, 71, 0.8); }
    .footer { margin: 16px 0 0; color: var(--muted); font-size: .77rem; text-align: center; }
    #import-file { display: none; }

    /* FILES — responsive library, upload progress, previews and safe offline states */
    .main-nav { display:flex; gap:8px; overflow-x:auto; padding:0 0 13px; margin:0 0 16px; scrollbar-width:thin; }
    .main-nav a { flex:0 0 auto; min-height:40px; display:inline-flex; align-items:center; padding:7px 12px; border:1px solid var(--line); border-radius:12px; background:rgba(14, 36, 48, 0.9); color:var(--ink); }
    .main-nav a:hover, .main-nav a:focus-visible { background:rgba(81, 215, 177, 0.08); }
    .dropzone { display:grid; min-height:132px; place-items:center; padding:20px; border:2px dashed var(--line); border-radius:16px; background:rgba(18, 54, 71, 0.8); text-align:center; transition:all .18s ease; }
    .dropzone.dragover { border-color:rgba(123, 233, 200, 0.7); background:rgba(81, 215, 177, 0.08); }
    .dropzone p { margin:6px 0 0; color:var(--muted); font-size:.84rem; }
    .file-toolbar { display:grid; grid-template-columns:minmax(0,1fr) 170px 170px; gap:8px; margin:14px 0; }
    .file-toolbar input, .file-toolbar select, .session-form input, .session-form textarea, .file-dialog textarea { width:100%; min-height:42px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:rgba(18, 54, 71, 0.75); color:var(--ink); }
    .file-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
    .file-card { min-width:0; padding:12px; border:1px solid var(--line); border-radius:16px; background:rgba(14, 36, 48, 0.9); }
    .file-thumb { display:grid; height:126px; place-items:center; overflow:hidden; margin:-1px -1px 10px; border-radius:12px; background:rgba(18, 54, 71, 0.7); color:var(--muted); font-size:2.2rem; }
    .file-thumb img { width:100%; height:100%; object-fit:cover; }
    .file-name { margin:0 0 4px; overflow-wrap:anywhere; font-weight:750; }
    .file-meta { margin:0 0 9px; color:var(--muted); font-size:.76rem; }
    .tag-list, .linked-files { display:flex; flex-wrap:wrap; gap:5px; margin:7px 0; }
    .tag-chip, .file-link-chip { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border:1px solid var(--line); border-radius:999px; background:rgba(81, 215, 177, 0.08); color:var(--ink); }
    .file-actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
    .upload-progress { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:8px; margin-top:8px; font-size:.78rem; }
    .upload-progress progress { grid-column:1 / -1; width:100%; height:7px; accent-color:var(--accent); }
    .storage-meter { height:9px; overflow:hidden; margin:8px 0 5px; border-radius:99px; background:rgba(18, 54, 71, 0.7); }
    .storage-meter span { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg, var(--accent) 0%, var(--accent-strong) 100%); transition:width .2s ease; }
    .storage-meter.warning span { background:#d68a29; }
    .file-dialog { position:fixed; z-index:30; inset:0; display:grid; overflow:auto; place-items:center; padding:max(14px,env(safe-area-inset-top,0px)) 14px max(14px,env(safe-area-inset-bottom,0px)) 14px; background:rgba(3,9,13,0.72); }
    .file-dialog-card { width:min(100%,820px); max-height:min(92vh,900px); overflow:auto; padding:18px; border:1px solid var(--line); border-radius:20px; background:rgba(14,36,48,0.96); box-shadow:0 20px 70px rgba(0,0,0,0.30); }
    .file-dialog-head { display:flex; align-items:start; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .file-dialog-head h2 { overflow-wrap:anywhere; }
    .preview-layout { display:grid; grid-template-columns:minmax(0,1fr); gap:10px; }
    .preview-layout.visual-entry { grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:start; }
    .preview-layout.visual-entry #visual-schedule-entry { min-width:0; padding:12px; border:1px solid var(--line); border-radius:14px; background:rgba(18,54,71,.8); }
    .preview-layout.visual-entry #visual-schedule-entry textarea { min-height:170px; }
    .preview-stage { min-height:180px; display:grid; place-items:center; overflow:auto; border:1px solid var(--line); border-radius:14px; background:rgba(18,54,71,.8); }
    .preview-stage img { display:block; max-width:100%; max-height:65vh; object-fit:contain; transition:transform .15s ease; }
    .preview-stage iframe { width:100%; height:min(68vh,650px); border:0; background:#fff; }
    .preview-stage pre { width:100%; max-height:65vh; overflow:auto; margin:0; padding:14px; white-space:pre-wrap; overflow-wrap:anywhere; color:var(--ink); font: .88rem/1.55 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .preview-tools { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
    .session-form { margin:0 0 14px; padding:13px; border-radius:14px; background:rgba(18,54,71,.8); }
    .session-grid { display:grid; grid-template-columns:minmax(0,1fr) 180px; gap:9px; }
    .session-card { margin-top:9px; padding:13px; border:1px solid var(--line); border-radius:14px; background:rgba(14,36,48,.9); }
    .session-card p { margin:5px 0; color:var(--muted); font-size:.84rem; white-space:pre-wrap; }
    .attach-list { display:grid; gap:7px; max-height:45vh; overflow:auto; margin:12px 0; }
    .attach-option { display:flex; align-items:center; gap:9px; padding:9px; border:1px solid var(--line); border-radius:10px; background:rgba(18,54,71,.7); }
    .attach-option input { width:18px; height:18px; accent-color:var(--accent); }
    .local-only-note { color:var(--muted); font-size:.8rem; }
    @media (max-width:650px) { .preview-layout.visual-entry { grid-template-columns:1fr; } .file-toolbar { grid-template-columns:1fr 1fr; } .file-toolbar input { grid-column:1 / -1; } .file-grid { grid-template-columns:1fr; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; } }

    @media (max-width: 600px) {
      body { padding-right: 12px; padding-left: 12px; }
      .topbar { margin-right: calc(0px - max(12px, env(safe-area-inset-right, 0px))); margin-left: calc(0px - max(12px, env(safe-area-inset-left, 0px))); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); }
      .header-date { display: block; font-size: .68rem; }
      .topbar { gap: 6px; }
      .header-actions { gap: 5px; }
      .section { padding: 15px; }
      .settings-grid, .form-grid { grid-template-columns: 1fr; gap: 0; }
      .auth-card { padding: 22px; }
    }
    @media (max-width: 380px) {
      .brand-mark { width: 36px; height: 36px; }
      .brand { gap: 7px; }
      .header-actions { gap: 5px; }
      .hero { padding: 17px; }
      .score { width: 62px; height: 62px; }
      .schedule-row { align-items: flex-start; }
      .schedule-actions { flex-wrap: wrap; justify-content: flex-end; }
      .schedule-actions .button { min-height: 31px; padding: 4px 7px; }
    }
  </style>
  <link rel="stylesheet" href="./theme.css">
  <link rel="stylesheet" href="./field-notes.css">
</head>
